name: Generate Snake Animation

# 把 GitHub 贡献图渲染成「贪吃蛇逐格吃掉」的动画 SVG，输出到 output 分支。
# README 直接引用 output 分支上的 SVG。
on:
  # 每天 00:00 UTC 自动刷新一次
  schedule:
    - cron: "0 0 * * *"
  # 允许在 Actions 页面手动触发
  workflow_dispatch:
  # 推送到 main 时自动生成一次（首次设置完推上去即可看到效果）
  push:
    branches:
      - main

# 让默认的 GITHUB_TOKEN 有写权限，才能把结果推到 output 分支
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVG (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          # 用仓库所有者的用户名（= zikuanqi）的公开贡献图
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push generated SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
